packages:
  - libs/web-design-system
  - libs/web-test-guards
  - demos/design-system-showcase
  - apps/ts-docs-web
  - apps/shep-docs-web
  - apps/providers-catalog-web
  - apps/taskstream-web
  - apps/shepherd
  - apps/shepherd/ui

# esbuild's postinstall is required by Vite/Astro; pnpm blocks build scripts
# by default. pnpm 11 uses the `allowBuilds` map.
allowBuilds:
  esbuild: true
