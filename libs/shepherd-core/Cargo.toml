[package]
name = "shepherd-core"
version.workspace = true
edition.workspace = true
description = "Headless Shepherd core: commands, events, snapshots, task lifecycle and shutdown."

[lib]
path = "src/shepherd_core.rs"

[dependencies]
agent-harness = { path = "../agent-harness" }
async-trait.workspace = true
sha2.workspace = true
thiserror.workspace = true
toasty = { version = "0.7", features = ["turso"] }
toasty-driver-turso = "0.7"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
