[package]
name = "shepherd-core"
version.workspace = true
edition.workspace = true
description = "Headless Shepherd core: commands, events, snapshots, task lifecycle and shutdown."

[lib]
path = "src/shepherd_core.rs"

[features]
test-support = ["dep:tempfile"]

[dependencies]
agent-harness = { path = "../agent-harness" }
async-trait.workspace = true
ignore = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syntect = { version = "5", features = ["default-syntaxes", "default-themes"] }
tempfile = { version = "3", optional = true }
thiserror.workspace = true
toasty = { version = "0.7", features = ["turso"] }
toasty-driver-turso = "0.7"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
agent-harness = { path = "../agent-harness", features = ["live-test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
