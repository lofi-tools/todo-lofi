[package]
name = "shepherd-core"
version.workspace = true
edition.workspace = true
description = "Headless Shepherd core: commands, events, snapshots, task lifecycle and shutdown."

[lib]
path = "src/shepherd_core.rs"

[dependencies]
agent-harness = { path = "../agent-harness" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
