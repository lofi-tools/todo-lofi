[package]
name = "acp-client"
version.workspace = true
edition.workspace = true
description = "Agent Client Protocol client: agent process launch, sessions, transcript model, fs and terminal capabilities."

[lib]
path = "src/acp_client.rs"

[dependencies]
agent-client-protocol = "2.1.0"
async-process = "2"
futures = "0.3"
gpui = { package = "gpui-pre", version = "0.3.4" }
gpui_tokio = { path = "../gpui-tokio" }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
regex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile = "3"
