[package]
name = "agent-harness"
version.workspace = true
edition.workspace = true
description = "Re-exports the harness contract and every adapter crate."

[lib]
path = "src/agent_harness.rs"

[features]
live-test-support = ["shep-harness-core/live-test-support", "shep-harness-codex/live-test-support"]
live-codex = ["live-test-support", "shep-harness-codex/live-codex"]
live-opencode = ["shep-harness-opencode/live-opencode"]
live-claude = ["shep-harness-acp/live-claude"]
live-pi = ["shep-harness-pi/live-pi"]
live-freebuff = ["shep-harness-freebuff/live-freebuff"]

[dependencies]
shep-harness-acp = { path = "../shep-harness-acp" }
shep-harness-codex = { path = "../shep-harness-codex" }
shep-harness-core = { path = "../shep-harness-core" }
shep-harness-freebuff = { path = "../shep-harness-freebuff" }
shep-harness-opencode = { path = "../shep-harness-opencode" }
shep-harness-pi = { path = "../shep-harness-pi" }

[dev-dependencies]
shep-harness-codex = { path = "../shep-harness-codex", features = ["live-test-support"] }
