[package]
name = "ai_providers"
version.workspace = true
edition.workspace = true

# Explicit lib root (per AGENTS.md) so the entry point is named after the crate
# instead of the default `lib.rs`.
[lib]
path = "src/ai_providers.rs"

[dependencies]
cersei.workspace = true
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true }
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
anyhow.workspace = true
parking_lot = "0.12"

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"] }
