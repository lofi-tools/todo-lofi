[package]
name = "report_proc"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
quote = { version = "1.0.45", default-features = false }
proc-macro2 = { version = "1.0.106", default-features = false }
syn = { version = "2.0", default-features = false, features = [
  "clone-impls",
  "derive",
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }
zyn = { version = "0.5.4", features = ["pretty", "diagnostics"] }

[dev-dependencies]
zyn = { version = "0.5", features = [
  "pretty",
  "diagnostics",
] } # pretty for formatted assertions
snafu = "0.8" # for __InternalExtractErrorType trait in generated code
