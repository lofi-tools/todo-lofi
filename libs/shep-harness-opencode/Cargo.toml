[package]
name = "shep-harness-opencode"
version.workspace = true
edition.workspace = true
description = "OpenCode adapter for Shepherd: ACP plus the native HTTP session."

[features]
live-opencode = []

[dependencies]
acp-client = { path = "../acp-client" }
shep-harness-acp = { path = "../shep-harness-acp" }
shep-harness-core = { path = "../shep-harness-core" }
async-trait.workspace = true
base64 = "0.22"
bytes = "1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
acp-client = { path = "../acp-client", features = ["test-support"] }
futures-channel = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tracing-subscriber.workspace = true
