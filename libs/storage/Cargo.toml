[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"


[dependencies]
tokio.workspace = true
toasty = { version = "0.7", features = ["turso", "serde", "jiff"] }
toasty-driver-turso = { version = "0.7" }
toasty-cli = "0.7"
jiff = "0.2"
# ax-id = "0.1.2"
# entity_id = "*"
derive_entity_id = { path = "../derive_entity_id" }
anyhow.workspace = true
snafu.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
uuid.workspace = true
sha2.workspace = true
dirs = "6.0"
fastrace = { version = "0.7", features = ["enable"] }
fastrace-tracing = "0.1"
tracing = { version = "0.1", features = ["attributes", "log"] }
tracing-subscriber = "0.3"
include_dir = "0.7.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }


[features]
default = ["tracing"]
tracing = []          # TODO optional deps

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"] }
