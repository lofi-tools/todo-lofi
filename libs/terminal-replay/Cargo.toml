[package]
name = "terminal-replay"
version.workspace = true
edition.workspace = true
description = "Verification and replay of captured Shepherd terminal sessions."

[lib]
path = "src/terminal_replay.rs"

[features]
git = ["shepherd-core/git"]

[dependencies]
agent-harness = { path = "../agent-harness" }
serde_json.workspace = true
shepherd-core = { path = "../shepherd-core" }
terminal-renderer = { path = "../terminal-renderer" }

[dev-dependencies]
shepherd-core = { path = "../shepherd-core", features = ["test-support"] }
tempfile = "3"
