[package]
name = "desktop-gpui"
version.workspace = true
edition.workspace = true

[dependencies]
storage = { path = "../../libs/storage" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
jiff = { version = "0.2", features = ["serde"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
argh = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "2.0.0-alpha.12"
anyhow.workspace = true
uuid = { workspace = true, features = ["v4"] }


# [dependencies] # UI
gpui = { package = "gpui-pre", version = "0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.4", features = [
  "font-kit",
] }
gpui_tokio = { path = "../../libs/gpui-tokio" }
gpui-component = "0.6.1"
# # Optional, for default bundled assets
gpui-component-assets = { package = "gpui-kit-assets", version = "0.6.1" }
# # gpui = { git = "https://github.com/zed-industries/gpui", features = ["test-support"] }
# gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
# gpui = { version = "0.2.2" }
