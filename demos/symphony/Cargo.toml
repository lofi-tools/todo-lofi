[package]
name = "symphony"
version = "0.1.0"
edition = "2024"

[features]
prototype = ["dep:tokio", "dep:log", "dep:tracing", "dep:tracing-subscriber", "dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:snafu", "dep:dunce", "dep:time", "dep:reqwest", "dep:async-trait", "dep:argh"]

[[bin]]
name = "symphony"
path = "src/main.rs"
required-features = ["prototype"]

[dependencies]
tokio = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { version = "0.9", optional = true }
snafu = { workspace = true, optional = true }
dunce = { version = "^1", optional = true }
time = { version = "0.3", features = ["serde", "parsing", "formatting"], optional = true }
reqwest = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
argh = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"], optional = true }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"], optional = true }
