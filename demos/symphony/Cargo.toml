[package]
name = "symphony"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
snafu.workspace = true
dunce = "^1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
reqwest.workspace = true
async-trait.workspace = true
argh = "0.1"

[dev-dependencies]
tempfile = "3"

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"] }
