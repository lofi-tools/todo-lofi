<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoLofi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            padding-top: 40px; /* Space for macOS window controls */
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            -webkit-app-region: no-drag; /* Allow interaction with content */
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            padding: 30px;
        }
        
        
        .todo-input {
            width: 100%;
            padding: 16px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            background-color: #111111;
            color: #ffffff;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .todo-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .todo-input::placeholder {
            color: #666666;
        }
        
        .todo-list {
            list-style: none;
            padding: 0;
        }
        
        .todo-item {
            padding: 16px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s ease;
            border-radius: 6px;
            margin-bottom: 2px;
        }
        
        .todo-item:hover {
            background-color: #0f0f0f;
        }
        
        .todo-item:last-child {
            border-bottom: none;
        }
        
        .todo-item.completed {
            text-decoration: line-through;
            opacity: 0.5;
            color: #666666;
        }
        
        .todo-checkbox {
            margin-right: 16px;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }
        
        .todo-text {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
        }
        
        .delete-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .delete-btn:hover {
            background: linear-gradient(135deg, #ff5252, #e53935);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }
        
        .add-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .add-btn:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .add-btn:active {
            transform: translateY(0);
        }
        
        /* Smooth scrollbar for OLED */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="todo-form">
            <input type="text" id="todoInput" class="todo-input" placeholder="What needs to be done?" />
            <button id="addBtn" class="add-btn">Add Todo</button>
        </div>
        <ul id="todoList" class="todo-list">
            <!-- Todos will be added here dynamically -->
        </ul>
    </div>

    <script>
        // Basic frontend functionality - this would connect to Tauri backend
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        
        let todos = [];
        
        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} 
                           onchange="toggleTodo(${index})">
                    <span class="todo-text">${todo.text}</span>
                    <button class="delete-btn" onclick="deleteTodo(${index})">Delete</button>
                `;
                todoList.appendChild(li);
            });
        }
        
        function addTodo() {
            const text = todoInput.value.trim();
            if (text) {
                todos.push({ text, completed: false });
                todoInput.value = '';
                renderTodos();
            }
        }
        
        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }
        
        function deleteTodo(index) {
            todos.splice(index, 1);
            renderTodos();
        }
        
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
        
        // Initial render
        renderTodos();
        
        // TODO: Connect to Tauri backend APIs when ready
        // This would use Tauri's invoke() function to call Rust backend
    </script>
</body>
</html>
