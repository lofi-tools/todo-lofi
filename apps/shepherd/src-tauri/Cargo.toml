[package]
name = "shepherd"
version.workspace = true
edition.workspace = true
description = "Shepherd desktop shell: Tauri window, invoke commands and the event bridge."

[lib]
name = "shepherd_shell"
path = "src/lib.rs"

[[bin]]
name = "shepherd"
path = "src/main.rs"

[features]
desktop-codex-smoke = ["agent-harness/live-test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-harness = { path = "../../../libs/agent-harness" }
async-trait.workspace = true
# Keep the upstream per-cell combining-mark cap until a release includes it.
alacritty_terminal = { git = "https://github.com/alacritty/alacritty", rev = "ede2ac144da4dec4c075bfa803aacf3b3739bce6" }
compact_str = { version = "0.8", features = ["serde"] }
notify = "8.2"
portable-pty = "0.9.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shepherd-core = { path = "../../../libs/shepherd-core" }
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"

[dev-dependencies]
acp-client = { path = "../../../libs/acp-client", features = ["test-support"] }
shepherd-core = { path = "../../../libs/shepherd-core", features = ["test-support"] }
