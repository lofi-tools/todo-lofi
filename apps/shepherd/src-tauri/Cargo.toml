[package]
name = "shepherd"
version.workspace = true
edition.workspace = true
description = "Shepherd desktop shell: Tauri window, invoke commands and the event bridge."

[lib]
name = "shepherd_shell"
path = "src/lib.rs"

[[bin]]
name = "shepherd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-harness = { path = "../../../libs/agent-harness" }
serde.workspace = true
serde_json.workspace = true
shepherd-core = { path = "../../../libs/shepherd-core" }
tauri = { version = "2", features = [] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
shepherd-core = { path = "../../../libs/shepherd-core", features = ["test-support"] }
