[package]
name = "shepherd"
version.workspace = true
edition.workspace = true
description = "Shepherd desktop shell: Tauri window, invoke commands and the event bridge."

[lib]
name = "shepherd_shell"
path = "src/lib.rs"

[[bin]]
name = "shepherd"
path = "src/main.rs"

[features]
git = ["shepherd-core/git"]
desktop-codex-smoke = ["agent-harness/live-test-support"]
live-codex = ["desktop-codex-smoke", "agent-harness/live-codex"]
live-freebuff = ["agent-harness/live-freebuff"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-harness = { path = "../../../libs/agent-harness" }
async-trait.workspace = true
notify = "8.2"
mime_guess = "2"
percent-encoding = "2"
portable-pty = "0.9.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shepherd-core = { path = "../../../libs/shepherd-core" }
terminal-renderer = { path = "../../../libs/terminal-renderer" }
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18", features = ["preview-macos-un"] }

[dev-dependencies]
acp-client = { path = "../../../libs/acp-client", features = ["test-support"] }
shepherd-core = { path = "../../../libs/shepherd-core", features = ["test-support"] }
terminal-replay = { path = "../../../libs/terminal-replay" }
toasty = { version = "0.7", features = ["turso"] }
toasty-driver-turso = "0.7"
