[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
cersei = { workspace = true }
ai_providers = { path = "../../libs/ai_providers" }
# async, IO, web
tokio = { version = "1", features = ["full"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
# Terminal / TUI
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
termimad = "0.30"
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# Serde, formats, codecs
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
pulldown-cmark = "0.12"
syntect = { version = "5", features = ["default-syntaxes", "default-themes"] }
# Errors, logs
anyhow = "1"
fastrace = "0.7.17"

# System
dirs = { workspace = true }
# which = "8.0.2"
ctrlc = "3"
parking_lot = "0.12"
