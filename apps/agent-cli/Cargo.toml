[package]
name = "agent-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
cersei = { workspace = true }
ai_providers = { path = "../../libs/ai_providers" }
# async, IO, web
tokio = { version = "1", features = ["full"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = [ "json" ] }
# Terminal / TUI
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
termimad = "0.30"
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# Serde, formats, codecs
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_lenient = "0.2.4"
toml = "0.8"
uuid = { workspace = true }
pulldown-cmark = "0.12"
syntect = { version = "5", features = ["default-syntaxes", "default-themes"] }
# Errors, logs
anyhow = "1"
fastrace = "0.7.17"
# Telemetry database (separate from libs/storage and todo-2's database)
toasty = { version = "0.7", features = ["turso", "serde", "jiff"] }
toasty-driver-turso = { version = "0.7" }
sha2 = { workspace = true }
include_dir = "0.7.4"

# System
dirs = { workspace = true }
# which = "8.0.2"
ctrlc = "3"
parking_lot = "0.12"

[features]
# Tests that hit live model endpoints (prompting real models like ox-alpha to
# capture response formats). Not enabled by default: run them with
# `cargo test -p agent-cli --features live-tests -- --ignored`.
live-tests = []

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"] }
