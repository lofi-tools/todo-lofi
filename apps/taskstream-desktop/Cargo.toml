[package]
name = "taskstream-desktop"
version.workspace = true
edition.workspace = true

[package.metadata.bundle]
name = "taskstream"
identifier = "io.github.lofi-tools.taskstream"
icon = ["apps/taskstream-desktop/assets/icons/do-list-app.svg"]
short_description = "A lofi, local-first task manager"
category = "Productivity"
osx_minimum_system_version = "12.0"

[dependencies]
acp-client = { path = "../../libs/acp-client" }
storage = { path = "../../libs/storage" }
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
dirs.workspace = true
reqwest.workspace = true
jiff = "0.2"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# TEMPORARY: the `profiler` feature exposes gpui's foreground hang detector,
# used by `watch_for_foreground_hangs` while diagnosing UI stalls.
gpui = { package = "gpui-pre", version = "0.3.4", features = ["profiler"] }
# `runtime_shaders` makes the Apple backend (gpui_platform → gpui_pre_macos →
# gpui_pre_apple) stitch its Metal source with the generated header and compile
# it at run time instead of invoking `xcrun metal` from a build script. The Nix
# build runs that script inside a sandbox with no Xcode toolchain, so
# `nix build .#taskstream-desktop` fails on macOS without this feature.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.4", features = [
  "font-kit",
  "runtime_shaders",
] }
gpui_tokio = { path = "../../libs/gpui-tokio" }
gpui-component = "0.6.1"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.6.1" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.4", features = ["test-support"] }

# TLS backend per target: reqwest's default TLS (rustls) pulls aws-lc-rs,
# whose C sources do not compile under the mingw cross compiler (sched.h),
# so Windows uses the OS Schannel stack via native-tls instead. The rest
# replicates reqwest's own defaults, which the workspace dep opts out of.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy", "default-tls"] }
