[package]
name = "todo-2"
version.workspace = true
edition.workspace = true

[package.metadata.bundle]
name = "todo-lofi"
identifier = "io.github.lofi-tools.todo-lofi"
icon = ["apps/todo-2/assets/icons/do-list-app.svg"]
short_description = "A lofi, local-first task manager"
category = "Productivity"
osx_minimum_system_version = "12.0"

[dependencies]
acp-client = { path = "../../libs/acp-client" }
storage = { path = "../../libs/storage" }
tokio = { workspace = true, features = ["sync", "rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
dirs.workspace = true
reqwest.workspace = true
jiff = "0.2"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# TEMPORARY: the `profiler` feature exposes gpui's foreground hang detector,
# used by `watch_for_foreground_hangs` while diagnosing UI stalls.
gpui = { package = "gpui-pre", version = "0.3.4", features = ["profiler"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.4", features = [
  "font-kit",
] }
gpui_tokio = { path = "../../libs/gpui-tokio" }
gpui-component = "0.6.1"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.6.1" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.4", features = ["test-support"] }
