# tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "ff4dbc058918336ad4dda3aa930b5d832ff9758d" }
# dispatch2 = { git = "https://github.com/madsmtm/objc2", tag = "dispatch2-0.3.1" }
ctrlc = { path = "./patched/ctrlc" }
# (https://github.com/pacifio/cersei?rev=708c5055845ba6c682d92960cec99e3adbcca3e1#708c505)

# The vendored cersei-provider below is the ONLY patch to the cersei git
# source: it makes the OpenAI-compatible SSE reader emit `ThinkingDelta` for
# `delta.reasoning` / `reasoning_content` / `reasoning_details` (reasoning
# models like stealth/ox-alpha stream their thinking there), which the ACP
# server streams out as `agent_thought_chunk`. Keep its version + the rev
# below in sync with patched/cersei-provider/Cargo.toml.
#
# cersei-agent is vendored the same way so the agent runner's F-08 "answered
# without tools" nudge can be disabled per agent (AgentBuilder::no_tool_nudge);
# agent-cli sets it from the model family's quirks so chat-style families
# (e.g. hy3) stop after answering instead of being forced into a second turn.
[patch."https://github.com/pacifio/cersei"]
cersei-provider = { path = "patched/cersei-provider" }
cersei-agent = { path = "patched/cersei-agent" }
