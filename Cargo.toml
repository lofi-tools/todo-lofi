
[workspace]
resolver = "2"
package = { version = "0.1.0", edition = "2024" }
metadata.crane.name = "my-workspace"
members = ["apps/*", "libs/*", "demos/*"]


[workspace.dependencies]
# OWN LIBS
# todo-core = { path = "libs/core" }
# taskchampion = { git = "https://github.com/GothenburgBitFactory/taskchampion" }

# Async, web
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
async-trait = "0.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }        # "tcp-tls"
# iroh = { version = "0.15.0" } # Removed unused iroh

# Logs, errors
log = "0.4"
thiserror = "^1.0"
anyhow = "^1.0"
snafu = { version = "0.9.1", features = ["backtrace"] }
tracing = { version = "0.1", features = ["attributes", "log"] }
tracing-subscriber = "0.3"

# Formats, codecs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
regex = "1.12.4"
url = "2.5.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = { version = "6.0.0" }
cersei = { git = "https://github.com/pacifio/cersei", rev = "708c5055845ba6c682d92960cec99e3adbcca3e1" }


