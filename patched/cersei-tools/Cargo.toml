[package]
name = "cersei-tools"
version = "0.1.9"
edition = "2024"
authors = []
# repository.workspace = true
description = "Tool trait, built-in tools, and permission system for the Cersei SDK"
# readme = "../../README.md"

[dependencies]
cersei-types = {  git = "https://github.com/pacifio/cersei" }
cersei-mcp = {  git = "https://github.com/pacifio/cersei" }
cersei-lsp = {  git = "https://github.com/pacifio/cersei" }
# async-trait = { workspace = true }
# serde = { workspace = true }
# serde_json = { workspace = true }
# schemars = { workspace = true }
# tokio = { workspace = true }
# tracing = { workspace = true }
# dashmap = { workspace = true }
# parking_lot = { workspace = true }
# once_cell = { workspace = true }
# regex = { workspace = true }
# glob = { workspace = true }
# walkdir = { workspace = true }
# which = { workspace = true }
# nix = { workspace = true }
# tempfile = { workspace = true }
# similar = { workspace = true }
# uuid = { workspace = true }
# reqwest = { workspace = true }
# html2text = { workspace = true }
# chrono = { workspace = true }
# dirs = { workspace = true }
tree-sitter = "^0.26"
tree-sitter-bash = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
notify = { version = "7", optional = true }
portable-pty = { version = "0.8", optional = true }
base64 = "0.22"
tantivy = "0.22"
cersei-embeddings = {  git = "https://github.com/pacifio/cersei" }
cersei-vms = { git = "https://github.com/pacifio/cersei", optional = true }

tokio = { version = "1.44", features = ["full"] }
# tokio-stream = "0.1"
# tokio-util = { version = "0.7", features = ["codec", "rt"] }
# futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-webpki-roots"], default-features = false }
# reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# toml = "0.8"
# anyhow = "1"
# thiserror = "2"
tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
walkdir = "2"
tempfile = "3"
dirs = "5"
which = "7"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
# bytes = "1"
# base64 = "0.22"
# sha2 = "0.10"
# url = "2"
similar = "2"
# unicode-width = "0.2"
html2text = "0.12"
nix = { version = "0.29", features = ["process", "signal", "user"] }
schemars = { version = "0.8", features = ["derive"] }
# syn = { version = "2", features = ["full"] }
# quote = "1"
# proc-macro2 = "1"



[features]
default = ["file-watch"]
pty = ["dep:portable-pty"]
file-watch = ["dep:notify"]
vms = ["dep:cersei-vms"]
