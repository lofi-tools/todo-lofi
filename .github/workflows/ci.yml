name: CI

# Tests run on every push and pull request. The artifacts are built only for a
# version tag or a manual run: each packaging job compiles todo-2 through nix,
# which the nix store cache makes free on a repeat run but expensive the first
# time a lockfile changes.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# cache-nix-action purges stale caches, which needs write access to the cache.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      # The storage and coding-git suites commit to temporary repositories, which
      # needs an identity the runner does not have.
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@todo-lofi.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@todo-lofi.invalid
    steps:
      - uses: actions/checkout@v4

      # Determinate Nix, the same distribution the direnv setup installs.
      - uses: DeterminateSystems/determinate-nix-action@v3

      # The flake's devshell is the build environment, so caching the nix store
      # is what makes a repeat run skip the toolchain and everything the
      # devshell pulls in. A new flake.lock changes the primary key and the
      # prefix restore still reuses whatever is shared.
      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-last-accessed: P7D
          purge-primary-key: never
          # GitHub allows 10GB of cache per repository, so cap what each save
          # offers it rather than letting one runner fill the allowance.
          gc-max-store-size-linux: 4G
          gc-max-store-size-macos: 4G

      - name: Restore cargo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # todo-2 and the crates in its build closure, which is what the `t2` watch
      # list already tracks. `--impure` is what the repo's own .envrc passes: the
      # shared nix modules resolve one flake input with getFlake, which a pure
      # evaluation refuses.
      - name: Test
        run: nix develop --impure --command cargo test -p todo-2 -p storage -p acp-client -p gpui_tokio

  package-macos:
    name: Package (macOS)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # The same key as the test job: one store serves both.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # The release binary comes out of the flake's crane package, so a cache hit
      # means no compilation at all.
      - name: Build
        run: nix build .#todo-2 --no-link --print-out-paths > /tmp/todo-2-path

      # The bundle, its .zip and its .dmg. `t2-bundle` runs the same script for
      # local use, over a debug binary.
      - name: Package
        run: ./scripts/package-macos.sh --binary "$(cat /tmp/todo-2-path)/bin/todo-2" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  package-linux:
    name: Package (Linux)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      - name: Build
        run: nix build .#todo-2 --no-link --print-out-paths > /tmp/todo-2-path

      # appimagetool is not in nixpkgs and is not part of the reproducibility
      # guarantee either: it only wraps the tree the script already assembled.
      # Pinned and verified so the artifact cannot change under us.
      - name: Fetch appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      # In the devshell: it is where rsvg-convert and dpkg-deb come from.
      - name: Package
        run: |
          nix develop --impure --command ./scripts/package-linux.sh \
            --binary "$(cat /tmp/todo-2-path)/bin/todo-2" \
            --out dist \
            --appimagetool "$PWD/appimagetool"

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # Cross-compiled with mingw: the `todo-2-windows` shell (apps/todo-2/
      # part.p.nix) carries the toolchain, so cargo writes the .exe under the
      # target triple the shell also sets.
      - name: Build
        run: |
          nix develop .#devShells.x86_64-linux.todo-2-windows --impure --command \
            cargo build --release --locked -p todo-2

      - name: Package
        run: |
          ./scripts/package-windows.sh \
            --binary target/x86_64-pc-windows-gnu/release/todo-2.exe \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-windows
          path: dist/*
          if-no-files-found: error
