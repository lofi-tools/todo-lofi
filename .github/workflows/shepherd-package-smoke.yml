name: Shepherd package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install frontend dependencies
        run: nix develop --impure -c pnpm --filter shepherd-app --filter shepherd-ui install --frozen-lockfile
      - name: Build the macOS app bundle
        run: nix develop --impure -c pnpm --dir apps/shepherd build --debug --bundles app
      - name: Verify the macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          plist=$(find target -path '*/debug/bundle/macos/Shepherd.app/Contents/Info.plist' -print -quit)
          test -n "$plist"
          app=${plist%/Contents/Info.plist}
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 13.0
          xcrun vtool -show-build "$app/Contents/MacOS/shepherd" | grep -Eq '^[[:space:]]*minos 13\.0$'

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install frontend dependencies
        run: nix develop --impure -c pnpm --filter shepherd-app --filter shepherd-ui install --frozen-lockfile
      - name: Build the Debian package
        run: nix develop --impure -c pnpm --dir apps/shepherd build --debug --bundles deb
      - name: Inspect the Debian package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t packages < <(find target -path '*/debug/bundle/deb/*.deb' -type f -print)
          test "${#packages[@]}" -eq 1
          dpkg-deb --info "${packages[0]}"
          dpkg-deb --contents "${packages[0]}" | grep -F 'usr/bin/shepherd'
