name: Shepherd adapter smoke

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Preinstalled agent to exercise
        required: true
        type: choice
        options:
          - opencode
          - pi
          - claude-acp

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, shepherd-adapters]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: OpenCode native and ACP smoke
        if: inputs.agent == 'opencode'
        env:
          SHEPHERD_OPENCODE_TEST_SETTINGS: ${{ vars.SHEPHERD_ADAPTER_TEST_SETTINGS }}
        run: nix develop --impure -c cargo test --locked -p agent-harness --lib opencode::tests::installed_ -- --ignored

      - name: Pi RPC dialog probe
        if: inputs.agent == 'pi'
        env:
          SHEPHERD_PI_TEST_EXECUTABLE: ${{ vars.SHEPHERD_PI_TEST_EXECUTABLE }}
        run: nix develop --impure -c cargo test --locked -p agent-harness --lib pi::tests::installed_pi_exchanges_extension_dialog_records -- --ignored

      - name: Claude Code ACP session smoke
        if: inputs.agent == 'claude-acp'
        env:
          SHEPHERD_CLAUDE_TEST_SETTINGS: ${{ vars.SHEPHERD_ADAPTER_TEST_SETTINGS }}
        run: nix develop --impure -c cargo test --locked -p agent-harness --lib acp::tests::installed_claude_code_opens_an_acp_session -- --ignored
