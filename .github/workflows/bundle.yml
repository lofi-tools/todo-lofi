name: Bundle

# Artifacts are built only off main and version tags. Each packaging job
# compiles taskstream-desktop through nix, which the nix store cache makes free on a repeat
# run but expensive the first time a lockfile changes — which is why a pull
# request gets the test workflow alone.
#
# The bundles are both uploaded as workflow artifacts and published as a GitHub
# release (see the `release` job): a `v*` tag publishes that tag's release, and
# while the project has no version tags at all a push to main keeps a rolling
# pre-release up to date so the website has something to download.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# cache-nix-action purges stale caches, which needs write access to the cache.
permissions:
  contents: read
  actions: write

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same definition the pull-request workflow runs. It no longer gates the
  # packaging jobs below: tests and builds start at the same time.
  test:
    uses: ./.github/workflows/test.yml

  package-macos:
    name: Package (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # The same key the test job uses: one store serves both.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # The release binary comes out of the flake's crane package, so a cache hit
      # means no compilation at all.
      - name: Build
        run: nix build .#taskstream-desktop --no-link --print-out-paths > /tmp/taskstream-desktop-path

      # The bundle, its .zip and its .dmg. `t2-bundle` runs the same script for
      # local use, over a debug binary.
      - name: Package
        run: ./scripts/package-macos.sh --binary "$(cat /tmp/taskstream-desktop-path)/bin/taskstream-desktop" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: taskstream-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # Fully hermetic, no `--impure`: the tarball, .deb and AppImage are all
      # assembled by `packages.taskstream-linux-dist`, which runs
      # scripts/package-linux.sh inside the sandbox with every tool (down to
      # appimagetool, fetched by content hash) from nixpkgs. The AppImage's
      # runtime is pinned the same way and handed to appimagetool with
      # `--runtime-file`: left to itself appimagetool downloads it, and a
      # sandbox has no network to do that with.
      - name: Build
        run: nix build .#taskstream-linux-dist --print-out-paths > /tmp/taskstream-desktop-dist

      - name: Collect
        run: mkdir -p dist && cp "$(cat /tmp/taskstream-desktop-dist)"/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: taskstream-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # Built natively instead of cross-compiled with mingw: gpui-pre-windows'
      # build script compiles its HLSL shaders only when the *host* is Windows
      # (`#[cfg(target_os = "windows")]` in build.rs), so a Linux-host cross
      # build never emits the `shaders_bytes.rs` the crate then `include!`s.
      # The Windows SDK's fxc.exe that the build script needs ships on the
      # runner image and is found via the registry lookup.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo caches
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-taskstream-desktop-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked -p taskstream-desktop

      # Git Bash ships on the runner image; the default PowerShell would not
      # execute the packaging script.
      - name: Package
        shell: bash
        run: |
          ./scripts/package-windows.sh \
            --binary target/release/taskstream-desktop.exe \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: taskstream-windows
          path: dist/*
          if-no-files-found: error

  # Publishes the bundles the packaging jobs uploaded. Two shapes, one job:
  # a `v*` tag push publishes a release for that tag, and — only while the
  # repository has no `v*` tags yet — a push to main keeps one rolling
  # pre-release (`latest`) current, so the download link on the website works
  # from the first push. Once a version tag exists, main stops publishing and
  # releases come from tags alone.
  release:
    name: Publish
    needs: [package-macos, package-linux, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # All three jobs' artifacts, flattened into one directory.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bash rather than the executable bit: the flag file bit is not
          # reliable across the runners the job could move to.
          version=$(bash ./scripts/version.sh)
          notes="Unsigned development builds of taskstream $version.

          macOS: taskstream-$version-macos-<arch>.zip or .dmg
          Linux: taskstream-$version-linux-<arch>.tar.gz, .deb or .AppImage
          Windows: taskstream-$version-windows-x86_64.zip"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "${GITHUB_REF#refs/tags/}" dist/* \
              --title "taskstream ${GITHUB_REF#refs/tags/}" \
              --notes "$notes"
            exit 0
          fi

          # A main push only publishes while no version tag exists. `latest`
          # itself is not a `v*` tag, so the rolling release never switches
          # this off on its own.
          if git ls-remote --tags origin 'refs/tags/v*' | grep -q .; then
            echo "version tags exist; main no longer publishes a rolling release"
            exit 0
          fi

          # Replace rather than edit: the rolling tag has to move to this
          # commit, and editing an existing release cannot move the tag it
          # already points at. The window where no `latest` release exists is
          # one API round trip; the website falls back to the releases page in
          # it. Concurrency serializes the runs, so two pushes cannot race here.
          gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "taskstream $version (latest main)" \
            --notes "$notes" \
            --prerelease
