name: Bundle

# Artifacts are built only off main and version tags. Each packaging job
# compiles todo-2 through nix, which the nix store cache makes free on a repeat
# run but expensive the first time a lockfile changes — which is why a pull
# request gets the test workflow alone.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# cache-nix-action purges stale caches, which needs write access to the cache.
permissions:
  contents: read
  actions: write

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same definition the pull-request workflow runs, so a release cannot be
  # built from a commit that never passed the tests.
  test:
    uses: ./.github/workflows/test.yml

  package-macos:
    name: Package (macOS)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # The same key the test job uses: one store serves both.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # The release binary comes out of the flake's crane package, so a cache hit
      # means no compilation at all.
      - name: Build
        run: nix build .#todo-2 --no-link --print-out-paths > /tmp/todo-2-path

      # The bundle, its .zip and its .dmg. `t2-bundle` runs the same script for
      # local use, over a debug binary.
      - name: Package
        run: ./scripts/package-macos.sh --binary "$(cat /tmp/todo-2-path)/bin/todo-2" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-macos
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  package-linux:
    name: Package (Linux)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      - name: Build
        run: nix build .#todo-2 --no-link --print-out-paths > /tmp/todo-2-path

      # appimagetool is not in nixpkgs and is not part of the reproducibility
      # guarantee either: it only wraps the tree the script already assembled.
      # Pinned and verified so the artifact cannot change under us.
      - name: Fetch appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      # In the devshell: it is where rsvg-convert and dpkg-deb come from.
      - name: Package
        run: |
          nix develop --impure --command ./scripts/package-linux.sh \
            --binary "$(cat /tmp/todo-2-path)/bin/todo-2" \
            --out dist \
            --appimagetool "$PWD/appimagetool"

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-primary-key: never

      # Cross-compiled with mingw: the `todo-2-windows` shell (apps/todo-2/
      # part.p.nix) carries the toolchain, so cargo writes the .exe under the
      # target triple the shell also sets.
      - name: Build
        run: |
          nix develop .#devShells.x86_64-linux.todo-2-windows --impure --command \
            cargo build --release --locked -p todo-2

      - name: Package
        run: |
          ./scripts/package-windows.sh \
            --binary target/x86_64-pc-windows-gnu/release/todo-2.exe \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lofi-windows
          path: dist/*
          if-no-files-found: error
