name: Test

# Runs on every pull request, and is called by the bundle workflow via
# `workflow_call` so a push to main or a release tag is tested by this same
# definition rather than a copy of it.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# cache-nix-action purges stale caches, which needs write access to the cache.
permissions:
  contents: read
  actions: write

concurrency:
  # A distinct group from the bundle workflow, which calls this one: sharing a
  # group would make each cancel the other. Nothing cancels: a new push leaves
  # in-flight runs alone.
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      # The storage and coding-git suites commit to temporary repositories, which
      # needs an identity the runner does not have. (Also set inside the check
      # derivation itself; repeated here so a local `cargo test` in CI matches.)
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@taskstream.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@taskstream.invalid
    steps:
      - uses: actions/checkout@v4

      # Determinate Nix, the same distribution the direnv setup installs.
      - uses: DeterminateSystems/determinate-nix-action@v3

      # Only the nix store is cached. The old incremental `target/` cache is
      # gone on purpose: a stale `target/` restored under `nix develop` is
      # what produced unreproducible failures like the missing rustls
      # build-script binary. Tests build hermetically from the flake instead.
      - name: Restore the nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-last-accessed: P7D
          purge-primary-key: never
          # GitHub allows 10GB of cache per repository, so cap what each save
          # offers it rather than letting one runner fill the allowance.
          gc-max-store-size-linux: 4G
          gc-max-store-size-macos: 4G

      # Hermetic test suites from the flake (`checks.taskstream-desktop-tests`: taskstream-desktop and
      # the crates in its build closure, the same set the `t2` watch loop
      # covers). `--impure` is what the repo's own .envrc passes: the shared
      # nix modules resolve one flake input with getFlake, which a pure
      # evaluation refuses. `--print-build-logs` streams cargo output so
      # failures are visible without a separate `nix log` step.
      - name: Test
        run: nix build --impure --print-build-logs .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).taskstream-desktop-tests
